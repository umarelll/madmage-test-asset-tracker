name: Sound Asset Revision
description: Request a change to an existing asset (too loud, wrong feel, new variation...)
title: "[Revision] "
labels: ["asset", "revision"]
body:
  - type: input
    id: tag
    attributes:
      label: Asset tag / ID
      description: Tag of the existing asset
      placeholder: SPL_Fireball_Cast
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Creature
        - Spell / Ability
        - Foley
        - Weapon / Combat
        - UI
        - Ambience
        - Environment / Props
        - Impact / Destruction
        - Cinematic
        - Other
        - Music - Combat
        - Music - Exploration
        - Music - Menu / UI
        - Music - Stinger
        - Music - Cutscene
        - VO - Dialogue
        - VO - Barks / Efforts
        - VO - Narration
        - VO - Cinematic
    validations:
      required: true

  - type: input
    id: original
    attributes:
      label: Original request / issue
      description: Link or issue number of the original asset request (if there is one)
      placeholder: "#42"

  - type: textarea
    id: feedback
    attributes:
      label: What should change?
      description: Be specific - what is wrong, and what would be better?
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Normal
        - Low
        - High
        - Blocker
    validations:
      required: true
