name: Sound Asset Request
description: Request a new sound, music or voice asset from the audio team
title: "[Asset] "
labels: ["asset"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the request! Fill in as much as you can. The audio team will claim it from the board.
        Type (SFX / Music / VO), category, priority and stage labels are applied automatically after you submit.

  - type: input
    id: tag
    attributes:
      label: Asset tag / ID
      description: Unique name following our naming convention, e.g. `SPL_Fireball_Cast`, `CRT_Troll_Roar`, `MUS_Swamp_Explore`, `VO_Warden_Bark_Hit`
      placeholder: CAT_Name_Variant
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: SFX categories are listed first, then Music, then VO. The type label (sfx / music / vo) is derived from this.
      options:
        - Creature
        - Spell / Ability
        - Foley
        - Weapon / Combat
        - UI
        - Ambience
        - Environment / Props
        - Impact / Destruction
        - Cinematic
        - Other
        - Music - Combat
        - Music - Exploration
        - Music - Menu / UI
        - Music - Stinger
        - Music - Cutscene
        - VO - Dialogue
        - VO - Barks / Efforts
        - VO - Narration
        - VO - Cinematic
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should it sound like? Mood, materials, size, character, emotion.
      placeholder: A heavy, wet stomp from a 4m swamp troll on mossy stone. Menacing, slightly comedic.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Game context / trigger
      description: Where and when does this play? What triggers it (animation event, gameplay event, cutscene)?
      placeholder: Plays on the troll's right-foot animation event during walk and run cycles in the Swamp level.
    validations:
      required: true

  - type: dropdown
    id: playback
    attributes:
      label: Playback type
      options:
        - One-shot
        - Loop
        - Stinger
        - Layered / multi-part
        - Not sure
    validations:
      required: true

  - type: input
    id: variations
    attributes:
      label: Variations needed
      description: How many variations (round-robin, intensity levels, etc.)?
      placeholder: "4 round-robin variations"

  - type: textarea
    id: music_vo
    attributes:
      label: Music / VO details (optional)
      description: |
        Music: length, BPM, key, loop points, intensity layers, states/transitions.
        VO: character, line IDs or script text, language/locale, emotion, placeholder (TTS) needed?

  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to videos, similar sounds in other games, concept art, animation clips, GDD pages. Drag and drop images/videos here.

  - type: input
    id: area
    attributes:
      label: Level / area / feature
      placeholder: Swamp level, Boss 2, Inventory UI ...

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Normal
        - Low
        - High
        - Blocker
    validations:
      required: true

  - type: input
    id: needed_by
    attributes:
      label: Needed by
      description: Date or milestone (e.g. Vertical Slice, Alpha, 2026-11-15)
      placeholder: Alpha

  - type: input
    id: wwise_event
    attributes:
      label: Wwise event name (optional)
      description: Name the event should have, or the existing event if the code/animation side already references one
      placeholder: Play_Troll_Footstep

  - type: input
    id: wwise_notes
    attributes:
      label: Wwise notes (optional)
      description: Bus, attenuation, RTPCs / switches / states, who hooks the event up in-engine
      placeholder: 3D, attenuation 30m, switch on surface type

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this asset has not already been requested
          required: true
        - label: The animation / feature is far enough along for sound design to start (placeholder is fine)
          required: false
