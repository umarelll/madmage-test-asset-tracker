# Synced to the repository by .github/workflows/sync-labels.yml
# Category labels must match the slug of the dropdown options in the issue forms
# (lowercase, non-alphanumerics -> "-"), e.g. "Music - Menu / UI" -> cat:music-menu-ui

- name: asset
  color: "1d76db"
  description: Audio asset request
- name: revision
  color: "5319e7"
  description: Change to an existing asset
- name: needs-review
  color: "d876e3"
  description: Waiting for audio lead sign-off to advance to the next stage

# Asset types (derived automatically from the category)
- name: "type:sfx"
  color: "006b75"
  description: Type - Sound effects
- name: "type:music"
  color: "006b75"
  description: Type - Music
- name: "type:vo"
  color: "006b75"
  description: Type - Voice-over

